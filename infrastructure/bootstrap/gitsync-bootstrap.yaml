AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - Lab 2 one-time Git sync bootstrap, deployed once from the CloudFormation
  console as stack onward-dev-gitsync-bootstrap. Creates the GitHub connection and the role
  CloudFormation Git sync uses to deploy the registry, network, service and pipeline stacks.
  Nothing here runs the application.

# Why this file is in infrastructure/bootstrap/ and not in infrastructure/templates/:
# it sets up the deployment tool, not the application. Git sync cannot deploy it, because it
# creates the GitHub connection and the role that Git sync itself needs. Upload it once in the
# CloudFormation console; it has no deployment file. Everything in templates/ is deployed by Git sync.

Parameters:
  Project:
    Type: String
    Default: onward
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

Resources:
  # Created as PENDING. A person approves it once in the GitHub handshake; AWS requires this.
  # Approve it for both repositories: the infrastructure repository is synced by Git sync.
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Properties:
      ConnectionName: !Sub '${Project}-${Environment}-github'
      ProviderType: GitHub
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # The role Git sync assumes to create and update the stacks.
  # Only AWS managed policies, no custom ones:
  #   PowerUserAccess - everything the stacks create except IAM (VPC, ECS, ECR, ELB, CodePipeline,
  #                     CodeDeploy, EventBridge, S3, CloudWatch, Budgets) and the CloudFormation
  #                     change sets Git sync runs
  #   IAMFullAccess   - the stacks create IAM roles (GitHub OIDC role, ECS task roles, pipeline roles)
  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-gitsync-role'
      Description: Used by CloudFormation Git sync to deploy the registry and order system stacks.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.sync.codeconnections.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/IAMFullAccess'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ConnectionArn:
    Value: !Ref GitHubConnection
  GitSyncRoleArn:
    Value: !GetAtt GitSyncRole.Arn

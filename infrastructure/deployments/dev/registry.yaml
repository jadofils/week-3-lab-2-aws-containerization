# CloudFormation Git sync deployment file for stack "onward-dev-registry".
# Create this stack first: the service and pipeline stacks import the repository it creates,
# and ECS needs an image in it before the service can start.
# Stack order: registry -> network -> service -> pipeline. Delete it last: it keeps every image.
template-file-path: infrastructure/templates/registry.yaml

parameters:
  Project: onward
  Owner: Jado Fils SEZIKEYE
  Environment: dev

  # Only the main branch of this repository may push images (GitHub OIDC, no access keys).
  GitHubOwner: jadofils
  AppRepository: week-3-lab-2-orders-app
  # Numeric IDs from GitHub's immutable OIDC subject (repo:owner@id/repo@id:ref:...).
  GitHubOwnerId: '114186160'
  AppRepositoryId: '1460005073'
  # Set to 'false' if this AWS account already has the token.actions.githubusercontent.com provider.
  CreateGitHubOidcProvider: 'false'

  ImagesToKeep: '15'

tags:
  Project: onward
  Owner: Jado Fils SEZIKEYE
  Environment: dev

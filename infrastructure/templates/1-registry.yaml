AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - Lab 2: image registry and keyless GitHub access. The ECR repository that
  holds every released order-app image, and the IAM role GitHub Actions assumes with OIDC to
  push to it. Created before the order system stack, because ECS cannot start a service
  until an image exists. Deployed by CloudFormation Git sync from infrastructure/deployments/dev/1-registry.yaml.

# Reading order: Parameters -> 1 Image registry and deployment bundle bucket -> 2 Keyless access for GitHub Actions -> Outputs
#
# No long-lived credentials: GitHub receives a short-lived OIDC token per workflow run and
# exchanges it for temporary credentials on one role that trusts only the main branch of the
# application repository and may only push to one repository.

Parameters:
  Project:
    Type: String
    Default: onward
    AllowedPattern: '^[a-z0-9-]{2,12}$'
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  GitHubOwner:
    Type: String
    Default: jadofils
    Description: GitHub user or organization that owns the application repository.
  AppRepository:
    Type: String
    Default: week-3-lab-2-orders-app
    Description: Application repository whose main branch may push images.
  # GitHub issues tokens with an immutable subject (name@id) for this repository. The numeric IDs
  # never change, so a deleted and recreated repository with the same name cannot assume the role.
  # Read them with: gh api repos/<owner>/<repo>/actions/oidc/customization/sub
  GitHubOwnerId:
    Type: String
    Default: '114186160'
    AllowedPattern: '^[0-9]+$'
    Description: Numeric GitHub ID of GitHubOwner.
  AppRepositoryId:
    Type: String
    Default: '1460005073'
    AllowedPattern: '^[0-9]+$'
    Description: Numeric GitHub ID of AppRepository.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: An account holds one GitHub OIDC provider. Set to 'false' if it already exists.

  ImagesToKeep:
    Type: Number
    Default: 15
    MinValue: 5
    Description: Released (sha-*) images kept for rollback; older ones are expired.

Conditions:
  CreateOidcProvider: !Equals
    - !Ref CreateGitHubOidcProvider
    - 'true'

Resources:
  # ============================================================ 1. Image registry and deployment bundle bucket
  # Every tag is immutable except "latest", which marks the release the pipeline follows.
  # Releases are deployed by image digest, so moving "latest" never changes a running version.
  OrdersRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-${Environment}-orders'
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: latest
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged layers left by replaced tags after 7 days",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the last ${ImagesToKeep} released images for rollback",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["sha-"], "countType": "imageCountMoreThan", "countNumber": ${ImagesToKeep} },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This bucket holds the deployment bundle (deploy-bundle.zip = taskdef.json + appspec.yaml) that the app
  # repository's CD workflow uploads on every release, next to the image it pushes to ECR. Versioning is on because CodePipeline reads an S3 source
  # by version; the current bundle is kept, and replaced versions are deleted after 30 days.
  DeployBundleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-orders-deploy-bundle-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-replaced-bundles
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This bucket policy refuses every request to the deployment bundle bucket that does not use HTTPS.
  DeployBundleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployBundleBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DeployBundleBucket.Arn
              - !Sub '${DeployBundleBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ============================================================ 2. Keyless access for GitHub Actions
  # GitHub's OIDC issuer. AWS validates its tokens against GitHub's published keys, so no
  # thumbprint is pinned here.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Push to this one repository only. A customer managed policy, never an inline one.
  EcrPushPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-ecr-push-policy'
      Description: Lets the application build push images to the order repository and nothing else.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SignInToRegistry
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: PushToOrderRepository
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:CompleteLayerUpload
              - ecr:DescribeImages
              - ecr:GetDownloadUrlForLayer
              - ecr:InitiateLayerUpload
              - ecr:PutImage
              - ecr:UploadLayerPart
            Resource: !GetAtt OrdersRepository.Arn

  # Upload the deployment bundle (taskdef.json + appspec.yaml) and nothing else: one object key.
  DeployBundleUploadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-deploy-bundle-upload-policy'
      Description: Lets the application build upload the deployment bundle and nothing else.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: UploadDeploymentBundle
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub '${DeployBundleBucket.Arn}/deploy/deploy-bundle.zip'

  # Trusts only workflow runs on the main branch of the application repository.
  # Pull requests, other branches and other repositories cannot assume it.
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-github-actions-role'
      Description: Assumed by GitHub Actions with OIDC to push order-app images. No access keys.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${AppRepository}@${AppRepositoryId}:ref:refs/heads/main'
      ManagedPolicyArns:
        - !Ref EcrPushPolicy
        - !Ref DeployBundleUploadPolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

Outputs:
  RepositoryName:
    Value: !Ref OrdersRepository
    Export:
      Name: !Sub '${Project}-${Environment}-orders-repository-name'
  RepositoryUri:
    Description: Where GitHub Actions pushes images and ECS pulls them from (through VPC endpoints).
    Value: !GetAtt OrdersRepository.RepositoryUri
    Export:
      Name: !Sub '${Project}-${Environment}-orders-repository-uri'
  RepositoryArn:
    Value: !GetAtt OrdersRepository.Arn
    Export:
      Name: !Sub '${Project}-${Environment}-orders-repository-arn'
  DeployBundleBucketName:
    Description: Where the app's CD workflow uploads deploy/deploy-bundle.zip. Delete all object versions before deleting the stack.
    Value: !Ref DeployBundleBucket
    Export:
      Name: !Sub '${Project}-${Environment}-deploy-bundle-bucket-name'
  DeployBundleBucketArn:
    Value: !GetAtt DeployBundleBucket.Arn
    Export:
      Name: !Sub '${Project}-${Environment}-deploy-bundle-bucket-arn'
  GitHubActionsRoleArn:
    Description: Set as the AWS_ROLE_ARN variable (not a secret) in the application repository.
    Value: !GetAtt GitHubActionsRole.Arn

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - Lab 2 release pipeline: a new image tagged latest in ECR fires EventBridge,
  which starts CodePipeline (Source: image from ECR + deployment bundle from S3 -> Deploy). CodeDeploy releases it blue/green with
  a 10% canary and rolls back automatically on errors.
  Deployed by CloudFormation Git sync from infrastructure/deployments/dev/4-pipeline.yaml.

# Stack 3 of 3: network -> service -> pipeline.
# Imports the ECS service, listener, target groups and task roles (service stack), and the image
# repository and deployment bundle bucket (registry stack).
# Reading order: Parameters -> 6 Release pipeline -> Outputs

# These are the settings of this stack. The values for dev are set in infrastructure/deployments/dev/4-pipeline.yaml.
Parameters:
  Project:
    Type: String
    Default: onward
    AllowedPattern: '^[a-z0-9-]{2,12}$'
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSCanary10Percent5Minutes
    AllowedValues:
      - CodeDeployDefault.ECSCanary10Percent5Minutes
      - CodeDeployDefault.ECSCanary10Percent15Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      - CodeDeployDefault.ECSAllAtOnce
    Description: How CodeDeploy shifts customers from blue to green.

  BlueRetentionMinutes:
    Type: Number
    Default: 15
    MinValue: 5
    MaxValue: 120
    Description: Old (blue) tasks keep running this long after a release, so a rollback is only a traffic switch.

Resources:
  # ============================================================ 6. Release pipeline
  # ECR push (latest) -> EventBridge -> CodePipeline: Source (ECR image + S3 bundle) -> Deploy (CodeDeploy blue/green)

  # This alarm counts server errors (HTTP 5xx) returned by the order tasks. Five or more in one minute
  # puts it in ALARM, and CodeDeploy then stops the release and sends traffic back to the old version.
  # Errors from tasks during a release roll it back automatically (CodeDeploy watches this alarm).
  TargetErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-${Environment}-orders-5xx-alarm'
      AlarmDescription: Order tasks are returning server errors. Stops and rolls back a release in progress.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value:
            Fn::ImportValue: !Sub '${Project}-${Environment}-service-alb-full-name'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # This bucket is the pipeline's private shared folder: each stage saves its files here for the next stage.
  # Files are encrypted, can never be made public, and are deleted after 30 days.
  # Pipeline artifacts (image details, task definition, appspec). Private, encrypted, short-lived.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-orders-artifacts-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This bucket policy refuses every request to the artifact bucket that does not use HTTPS.
  # A resource policy on the bucket (not an IAM inline policy): refuse unencrypted connections.
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # --- CodeDeploy: blue/green with canary, alarm rollback and a blue retention window
  # This role lets CodeDeploy start the new tasks, switch the load balancer listener and read the rollback alarm.
  # Only CodeDeploy can use it, and it has the AWS managed policy for ECS deployments only.
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-codedeploy-role'
      Description: Lets CodeDeploy create task sets, switch the listener and watch the rollback alarm.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This is the CodeDeploy application: the named folder that groups every release of the order app on ECS.
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${Project}-${Environment}-orders-deploy'
      ComputePlatform: ECS
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This deployment group holds the release rules: which service and listener to use, the blue and green
  # target groups, the 10% canary, automatic rollback on failure or alarm, and how long the old version is kept.
  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${Project}-${Environment}-orders-dg'
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: !Ref DeploymentConfigName
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        # Shift as soon as green is healthy; no manual approval (merging is the only manual step).
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref BlueRetentionMinutes
      ECSServices:
        - ClusterName:
            Fn::ImportValue: !Sub '${Project}-${Environment}-service-cluster-name'
          ServiceName:
            Fn::ImportValue: !Sub '${Project}-${Environment}-service-service-name'
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - Fn::ImportValue: !Sub '${Project}-${Environment}-service-listener-arn'
            TargetGroups:
              - Name:
                  Fn::ImportValue: !Sub '${Project}-${Environment}-service-blue-tg-name'
              - Name:
                  Fn::ImportValue: !Sub '${Project}-${Environment}-service-green-tg-name'
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
          - DEPLOYMENT_STOP_ON_REQUEST
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref TargetErrorsAlarm
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # --- CodePipeline (V2: billed per action-minute, supports stage rollback)
  # This policy lists the only things the pipeline may do: use the artifact bucket, read the pushed image and the
  # deployment bundle, start a CodeDeploy release, register the new task definition and hand the task roles to ECS.
  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-pipeline-policy'
      Description: Run the order release pipeline - read the image and the deployment bundle, deploy with CodeDeploy.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PipelineArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:GetBucketVersioning
              - s3:GetBucketLocation
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
          - Sid: SourceImage
            Effect: Allow
            Action: ecr:DescribeImages
            Resource: !ImportValue
              Fn::Sub: '${Project}-${Environment}-orders-repository-arn'
          - Sid: ReadDeploymentBundle
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetBucketVersioning
            Resource:
              - !ImportValue
                Fn::Sub: '${Project}-${Environment}-deploy-bundle-bucket-arn'
              - !Sub
                - '${BucketArn}/deploy/deploy-bundle.zip'
                - BucketArn: !ImportValue
                    Fn::Sub: '${Project}-${Environment}-deploy-bundle-bucket-arn'
          - Sid: DeployWithCodeDeploy
            Effect: Allow
            Action:
              - codedeploy:CreateDeployment
              - codedeploy:GetApplication
              - codedeploy:GetApplicationRevision
              - codedeploy:GetDeployment
              - codedeploy:GetDeploymentConfig
              - codedeploy:RegisterApplicationRevision
            Resource:
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}'
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/${DeploymentGroup}'
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'
          - Sid: RegisterNewRevision
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:TagResource
            Resource: '*'
          - Sid: HandTaskRolesToEcs
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - Fn::ImportValue: !Sub '${Project}-${Environment}-service-task-execution-role-arn'
              - Fn::ImportValue: !Sub '${Project}-${Environment}-service-task-role-arn'
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  # This role is the identity of the pipeline. Only CodePipeline can use it, and it has only the pipeline policy.
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-pipeline-role'
      Description: Used by CodePipeline to release new order-app images.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PipelinePolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This pipeline runs every release in two stages: Source (the image from ECR and the deployment bundle from S3)
  # -> Deploy (CodeDeploy blue/green). It keeps a history of every release, which is used for rollback.
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-pipeline'
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        # 1. Two sources, read together when EventBridge starts the pipeline:
        #    - Image: the pushed image. imageDetail.json carries its digest, so the release is pinned
        #      even if "latest" moves while it runs.
        #    - DeployBundle: deploy-bundle.zip (taskdef.json + appspec.yaml) uploaded by the app's CD
        #      workflow just before it pushed "latest". Not polled: only the image push starts a release.
        - Name: Source
          Actions:
            - Name: Image
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName: !ImportValue
                  Fn::Sub: '${Project}-${Environment}-orders-repository-name'
                ImageTag: latest
              OutputArtifacts:
                - Name: ImageArtifact
            - Name: DeployBundle
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                S3Bucket: !ImportValue
                  Fn::Sub: '${Project}-${Environment}-deploy-bundle-bucket-name'
                S3ObjectKey: deploy/deploy-bundle.zip
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: DeployArtifact
        # 2. Blue/green release. To undo a release after blue is gone, use
        #    "Start rollback" on this stage and pick the last good execution.
        - Name: Deploy
          Actions:
            - Name: BlueGreen
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                # taskdef.json and appspec.yaml inside deploy-bundle.zip (the action's default file names).
                TaskDefinitionTemplateArtifact: DeployArtifact
                AppSpecTemplateArtifact: DeployArtifact
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: DeployArtifact
                - Name: ImageArtifact
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # --- EventBridge: a new "latest" image starts the pipeline. GitHub needs no pipeline permission.
  # This policy allows exactly one action: start this release pipeline.
  EventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-events-policy'
      Description: Lets EventBridge start the order release pipeline and nothing else.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StartReleasePipeline
            Effect: Allow
            Action: codepipeline:StartPipelineExecution
            Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'

  # This role is the identity EventBridge uses to start the pipeline. Only EventBridge can use it.
  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-events-role'
      Description: Used by the image-pushed EventBridge rule to start the release pipeline.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventsPolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # This EventBridge rule watches ECR. When an image tagged latest is pushed successfully, it starts the pipeline,
  # so merging to main is the only manual step.
  # Matches only "latest", so one merge (which pushes sha-<commit> and latest) starts one release.
  ImagePushedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-image-pushed'
      Description: A new order-app image tagged latest starts the release pipeline.
      State: ENABLED
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !ImportValue
              Fn::Sub: '${Project}-${Environment}-orders-repository-name'
          image-tag:
            - latest
      Targets:
        - Id: release-pipeline
          Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: !GetAtt EventsRole.Arn

# These values are shown after deployment: the pipeline, CodeDeploy names and the artifact bucket.
Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CodeDeployApplication:
    Value: !Ref CodeDeployApplication
  DeploymentGroupName:
    Value: !Ref DeploymentGroup
  ArtifactBucketName:
    Description: Empty this bucket before deleting the stack.
    Value: !Ref ArtifactBucket

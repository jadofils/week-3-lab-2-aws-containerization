AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - Lab 2 release pipeline: a new image tagged latest in ECR fires EventBridge,
  which starts CodePipeline (Source -> Prepare -> Deploy). CodeDeploy releases it blue/green with
  a 10% canary and rolls back automatically on errors.
  Deployed by CloudFormation Git sync from infrastructure/deployments/dev/4-pipeline.yaml.

# Stack 3 of 3: network -> service -> pipeline.
# Imports the ECS service, listener, target groups and task roles (service stack) and the image
# repository (registry stack).
# Reading order: Parameters -> 6 Release pipeline -> Outputs

Parameters:
  Project:
    Type: String
    Default: onward
    AllowedPattern: '^[a-z0-9-]{2,12}$'
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  ApplicationPort:
    Type: Number
    Default: 8080

  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSCanary10Percent5Minutes
    AllowedValues:
      - CodeDeployDefault.ECSCanary10Percent5Minutes
      - CodeDeployDefault.ECSCanary10Percent15Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      - CodeDeployDefault.ECSAllAtOnce
    Description: How CodeDeploy shifts customers from blue to green.

  BlueRetentionMinutes:
    Type: Number
    Default: 15
    MinValue: 5
    MaxValue: 120
    Description: Old (blue) tasks keep running this long after a release, so a rollback is only a traffic switch.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
      - 90

Resources:
  # ============================================================ 6. Release pipeline
  # ECR push (latest) -> EventBridge -> CodePipeline: Source -> Prepare -> Deploy (CodeDeploy blue/green)

  # Errors from tasks during a release roll it back automatically (CodeDeploy watches this alarm).
  TargetErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Project}-${Environment}-orders-5xx-alarm'
      AlarmDescription: Order tasks are returning server errors. Stops and rolls back a release in progress.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value:
            Fn::ImportValue: !Sub '${Project}-${Environment}-service-alb-full-name'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Pipeline artifacts (image details, task definition, appspec). Private, encrypted, short-lived.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-orders-artifacts-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # A resource policy on the bucket (not an IAM inline policy): refuse unencrypted connections.
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # --- CodeDeploy: blue/green with canary, alarm rollback and a blue retention window
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-codedeploy-role'
      Description: Lets CodeDeploy create task sets, switch the listener and watch the rollback alarm.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${Project}-${Environment}-orders-deploy'
      ComputePlatform: ECS
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${Project}-${Environment}-orders-dg'
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: !Ref DeploymentConfigName
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        # Shift as soon as green is healthy; no manual approval (merging is the only manual step).
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref BlueRetentionMinutes
      ECSServices:
        - ClusterName:
            Fn::ImportValue: !Sub '${Project}-${Environment}-service-cluster-name'
          ServiceName:
            Fn::ImportValue: !Sub '${Project}-${Environment}-service-service-name'
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - Fn::ImportValue: !Sub '${Project}-${Environment}-service-listener-arn'
            TargetGroups:
              - Name:
                  Fn::ImportValue: !Sub '${Project}-${Environment}-service-blue-tg-name'
              - Name:
                  Fn::ImportValue: !Sub '${Project}-${Environment}-service-green-tg-name'
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
          - DEPLOYMENT_STOP_ON_REQUEST
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref TargetErrorsAlarm
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # --- Prepare: turn the latest task definition revision into the files CodeDeploy needs
  PrepareLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${Project}/${Environment}/orders-prepare'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  PreparePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-prepare-policy'
      Description: Read the order task definition, use the artifact bucket and write build logs.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadTaskDefinition
            Effect: Allow
            Action: ecs:DescribeTaskDefinition
            Resource: '*'
          - Sid: PipelineArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
            Resource: !Sub '${ArtifactBucket.Arn}/*'
          - Sid: BuildLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub '${PrepareLogGroup.Arn}:*'

  PrepareRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-prepare-role'
      Description: Used by the CodeBuild project that prepares each release for CodeDeploy.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PreparePolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Copies the latest registered revision of the task family (CloudFormation's settings, or the
  # last release), replaces the image with <IMAGE1_NAME> for CodeDeploy to fill with the new
  # image digest, and writes the appspec that names the container and port.
  PrepareProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-prepare'
      Description: Writes taskdef.json and appspec.yaml for the CodeDeploy blue/green action.
      ServiceRole: !GetAtt PrepareRole.Arn
      TimeoutInMinutes: 10
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: TASK_FAMILY
            Value: !Sub '${Project}-${Environment}-orders'
          - Name: CONTAINER_NAME
            Value: orders
          - Name: CONTAINER_PORT
            Value: !Ref ApplicationPort
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref PrepareLogGroup
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > current.json
                - |
                  python3 - <<'PY'
                  import json, os
                  td = json.load(open("current.json"))
                  for key in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                              "compatibilities", "registeredAt", "registeredBy", "deregisteredAt"):
                      td.pop(key, None)
                  name = os.environ["CONTAINER_NAME"]
                  for container in td["containerDefinitions"]:
                      if container["name"] == name:
                          container["image"] = "<IMAGE1_NAME>"
                  json.dump(td, open("taskdef.json", "w"), indent=2)
                  open("appspec.yaml", "w").write(
                      "version: 0.0\n"
                      "Resources:\n"
                      "  - TargetService:\n"
                      "      Type: AWS::ECS::Service\n"
                      "      Properties:\n"
                      "        TaskDefinition: <TASK_DEFINITION>\n"
                      "        LoadBalancerInfo:\n"
                      f"          ContainerName: \"{name}\"\n"
                      f"          ContainerPort: {os.environ['CONTAINER_PORT']}\n")
                  PY
                - cat taskdef.json appspec.yaml
          artifacts:
            files:
              - taskdef.json
              - appspec.yaml
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # --- CodePipeline (V2: billed per action-minute, supports stage rollback)
  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-pipeline-policy'
      Description: Run the order release pipeline - read the image, run Prepare, deploy with CodeDeploy.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PipelineArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:GetBucketVersioning
              - s3:GetBucketLocation
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
          - Sid: SourceImage
            Effect: Allow
            Action: ecr:DescribeImages
            Resource: !ImportValue
              Fn::Sub: '${Project}-${Environment}-orders-repository-arn'
          - Sid: RunPrepare
            Effect: Allow
            Action:
              - codebuild:StartBuild
              - codebuild:BatchGetBuilds
            Resource: !GetAtt PrepareProject.Arn
          - Sid: DeployWithCodeDeploy
            Effect: Allow
            Action:
              - codedeploy:CreateDeployment
              - codedeploy:GetApplication
              - codedeploy:GetApplicationRevision
              - codedeploy:GetDeployment
              - codedeploy:GetDeploymentConfig
              - codedeploy:RegisterApplicationRevision
            Resource:
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}'
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/${DeploymentGroup}'
              - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'
          - Sid: RegisterNewRevision
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:TagResource
            Resource: '*'
          - Sid: HandTaskRolesToEcs
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - Fn::ImportValue: !Sub '${Project}-${Environment}-service-task-execution-role-arn'
              - Fn::ImportValue: !Sub '${Project}-${Environment}-service-task-role-arn'
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-pipeline-role'
      Description: Used by CodePipeline to release new order-app images.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PipelinePolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-pipeline'
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        # 1. The image that was pushed. imageDetail.json carries its digest, so the release is
        #    pinned even if "latest" moves while it runs.
        - Name: Source
          Actions:
            - Name: Image
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName: !ImportValue
                  Fn::Sub: '${Project}-${Environment}-orders-repository-name'
                ImageTag: latest
              OutputArtifacts:
                - Name: ImageArtifact
        # 2. taskdef.json + appspec.yaml from the latest task definition revision.
        - Name: Prepare
          Actions:
            - Name: RenderDeploymentFiles
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref PrepareProject
              InputArtifacts:
                - Name: ImageArtifact
              OutputArtifacts:
                - Name: DeployArtifact
        # 3. Blue/green release. To undo a release after blue is gone, use
        #    "Start rollback" on this stage and pick the last good execution.
        - Name: Deploy
          Actions:
            - Name: BlueGreen
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                TaskDefinitionTemplateArtifact: DeployArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: DeployArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: DeployArtifact
                - Name: ImageArtifact
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # --- EventBridge: a new "latest" image starts the pipeline. GitHub needs no pipeline permission.
  EventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${Project}-${Environment}-orders-events-policy'
      Description: Lets EventBridge start the order release pipeline and nothing else.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: StartReleasePipeline
            Effect: Allow
            Action: codepipeline:StartPipelineExecution
            Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-${Environment}-orders-events-role'
      Description: Used by the image-pushed EventBridge rule to start the release pipeline.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventsPolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Matches only "latest", so one merge (which pushes sha-<commit> and latest) starts one release.
  ImagePushedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Project}-${Environment}-orders-image-pushed'
      Description: A new order-app image tagged latest starts the release pipeline.
      State: ENABLED
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !ImportValue
              Fn::Sub: '${Project}-${Environment}-orders-repository-name'
          image-tag:
            - latest
      Targets:
        - Id: release-pipeline
          Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: !GetAtt EventsRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CodeDeployApplication:
    Value: !Ref CodeDeployApplication
  DeploymentGroupName:
    Value: !Ref DeploymentGroup
  ArtifactBucketName:
    Description: Empty this bucket before deleting the stack.
    Value: !Ref ArtifactBucket

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics - Lab 2 network: a VPC across two Availability Zones with public subnets for
  the load balancer and private subnets for the tasks, VPC endpoints instead of a NAT gateway,
  and every security group. The private subnets have no route to the internet; tasks reach ECR,
  CloudWatch Logs and S3 only through the endpoints.
  Deployed by CloudFormation Git sync from infrastructure/deployments/dev/network.yaml.

# Stack 1 of 3 that run the service: network -> service -> pipeline (after the registry stack).
# Reading order: Parameters -> 1 Network -> 2 Private connectivity -> 3 Security groups -> Outputs
#
#   internet --80--> [alb-sg] --8080--> [task-sg] --443--> [endpoint-sg] / S3 prefix list

Parameters:
  Project:
    Type: String
    Default: onward
    AllowedPattern: '^[a-z0-9-]{2,12}$'
  Owner:
    Type: String
    Default: Jado Fils SEZIKEYE
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnetCidrA:
    Type: String
    Default: 10.0.0.0/24

  PublicSubnetCidrB:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnetCidrA:
    Type: String
    Default: 10.0.10.0/24

  PrivateSubnetCidrB:
    Type: String
    Default: 10.0.11.0/24

  S3PrefixListId:
    Type: String
    Default: pl-6da54004
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >
      AWS managed prefix list for S3 in this Region (eu-west-1). Tasks may send HTTPS to it to
      download image layers through the S3 gateway endpoint. Look it up with:
      aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.eu-west-1.s3

  ApplicationPort:
    Type: Number
    Default: 8080

Resources:
  # ============================================================ 1. Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      # Both are required for interface endpoints' private DNS names to resolve.
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-vpc'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Serves the public subnets only: it carries customer traffic to and from the load balancer.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-igw'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets hold only the load balancer.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      CidrBlock: !Ref PublicSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-public-a'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      CidrBlock: !Ref PublicSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-public-b'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Private subnets hold the tasks and the endpoint interfaces. Nothing here has a public IP.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      CidrBlock: !Ref PrivateSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-private-a'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      CidrBlock: !Ref PrivateSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-private-b'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-public-rt'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  # Deliberately NO default route: no NAT gateway and no internet gateway route.
  # The only routes are the local VPC route and the S3 gateway endpoint (section 2).
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-private-rt'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB

  # ============================================================ 2. Private connectivity
  # Exactly what a Fargate task needs, and nothing more: ecr.api and ecr.dkr to pull the image,
  # S3 for the image layers, logs for the awslogs driver. Each interface endpoint has a network
  # interface in both private subnets, so it survives losing a zone. Private DNS makes the
  # normal service names resolve to these private addresses.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-ecr-api-vpce'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  EcrDockerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-ecr-dkr-vpce'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-logs-vpce'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Gateway endpoint: free, works through a route in the private route table.
  # Its policy allows only the S3 bucket where ECR stores image layers in this Region.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EcrImageLayersOnly
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-s3-vpce'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # ============================================================ 3. Security groups
  # All traffic rules in one place. The IAM roles the tasks run with are in the service stack.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Project}-${Environment}-orders-alb-sg'
      GroupDescription: The only public entry point - HTTP from customers to the load balancer.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Customers and merchants.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Forward requests and health checks to tasks inside the VPC only.
          IpProtocol: tcp
          FromPort: !Ref ApplicationPort
          ToPort: !Ref ApplicationPort
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-alb-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Tasks accept the app port from the load balancer only, and may send HTTPS only to the
  # endpoints and to S3 through the gateway endpoint. There is no admin port: tasks are
  # replaced, never repaired, and their logs are in CloudWatch.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Project}-${Environment}-orders-task-sg'
      GroupDescription: Order tasks - app port from the load balancer; HTTPS out to VPC endpoints only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Application traffic and health checks from the load balancer only.
          IpProtocol: tcp
          FromPort: !Ref ApplicationPort
          ToPort: !Ref ApplicationPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - Description: ECR and CloudWatch Logs through the interface endpoints.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref EndpointSecurityGroup
        - Description: ECR image layers in S3 through the gateway endpoint.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-task-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # Endpoint interfaces only answer; they never start connections.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Project}-${Environment}-orders-endpoint-sg'
      GroupDescription: VPC endpoint interfaces - HTTPS from order tasks only.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: No outbound traffic (replaces the default allow-all rule).
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Environment}-orders-endpoint-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Environment
          Value: !Ref Environment

  # A separate rule, because the task and endpoint groups refer to each other.
  EndpointIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      Description: HTTPS from order tasks.
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TaskSecurityGroup

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub '${Project}-${Environment}-network-vpc-id'
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub '${Project}-${Environment}-network-public-subnet-a'
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub '${Project}-${Environment}-network-public-subnet-b'
  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub '${Project}-${Environment}-network-private-subnet-a'
  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub '${Project}-${Environment}-network-private-subnet-b'
  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: !Sub '${Project}-${Environment}-network-alb-sg-id'
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
    Export:
      Name: !Sub '${Project}-${Environment}-network-task-sg-id'
  PrivateRouteTableId:
    Description: Has no route to the internet - only local and the S3 gateway endpoint.
    Value: !Ref PrivateRouteTable
